name: CI Pipeline

on:
  pull_request:
    branches: [dev, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: xpro
          POSTGRES_PASSWORD: xpro
          POSTGRES_DB: xpro_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U xpro"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 25

    env:
      DATABASE_URL: postgresql://xpro:xpro@localhost:5432/xpro_ci

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Apply migrations (fails the PR if a migration is broken)
        run: npx prisma migrate deploy

      - name: Security Audit
        run: npm audit --audit-level=critical

      - name: Run ESLint
        run: npx eslint "{src,apps,libs,test}/**/*.ts"

      - name: Run Tests
        run: npm test

      - name: Run Build
        run: npm run build

  migration-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Lints only migrations this PR adds or changes. Existing migrations are
      # immutable, so re-flagging them would only add noise. Rules live in
      # .squawk.toml.
      - name: Lint new migrations with Squawk
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          mapfile -t CHANGED < <(git diff --name-only --diff-filter=AM \
            "origin/${BASE_REF}...HEAD" -- 'prisma/migrations/*/migration.sql')
          if [ "${#CHANGED[@]}" -eq 0 ]; then
            echo "No migration changes in this PR."
            exit 0
          fi
          printf 'Linting %s\n' "${CHANGED[@]}"
          npx --yes squawk-cli@2.68.0 "${CHANGED[@]}"

  notify-failure:
    needs: [ci, migration-lint]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Notify Discord (CI failed)
        # A notification problem must never change the CI result.
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          if [ -z "${DISCORD_WEBHOOK_URL:-}" ]; then
            echo "DISCORD_WEBHOOK_URL not set; skipping notification."
            exit 0
          fi
          export RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          python3 - "$DISCORD_WEBHOOK_URL" <<'PY'
          import json, os, sys, urllib.request
          content = (
              f"❌ **xpro-backend CI failed** — commit `{os.environ.get('GITHUB_SHA', '')[:7]}` "
              f"on `{os.environ.get('GITHUB_REF_NAME', '')}` ({os.environ.get('GITHUB_EVENT_NAME', '')}).\n"
              f"{os.environ['RUN_URL']}"
          )
          data = json.dumps({"content": content}).encode()
          req = urllib.request.Request(
              sys.argv[1],
              data=data,
              headers={
                  "Content-Type": "application/json",
                  # Discord's Cloudflare front rejects urllib's default
                  # User-Agent with 403 (error 1010).
                  "User-Agent": "xpro-backend-ci (+https://github.com/Cyfamod-Technologies/xpro-backend)",
              },
          )
          urllib.request.urlopen(req, timeout=15)
          PY
