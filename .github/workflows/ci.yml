name: CI Pipeline

on:
  pull_request:
    branches: [dev, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: xpro
          POSTGRES_PASSWORD: xpro
          POSTGRES_DB: xpro_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U xpro"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://xpro:xpro@localhost:5432/xpro_ci

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Apply migrations (fails the PR if a migration is broken)
        run: npx prisma migrate deploy

      - name: Security Audit
        run: npm audit --audit-level=critical

      - name: Run ESLint
        run: npm run lint

      - name: Run Tests
        run: npm test

      - name: Run Build
        run: npm run build
