name: CI Pipeline

on:
  pull_request:
    branches: [dev, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Security Audit
        run: npm audit --audit-level=critical

      - name: Run ESLint
        run: npm run lint

      - name: Run Tests
        run: npm test

      - name: Run Build
        run: npm run build

  migration-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Lints only migrations this PR adds or changes. Existing migrations are
      # immutable, so re-flagging them would only add noise. Rules live in
      # .squawk.toml.
      - name: Lint new migrations with Squawk
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          mapfile -t CHANGED < <(git diff --name-only --diff-filter=AM \
            "origin/${BASE_REF}...HEAD" -- 'prisma/migrations/*/migration.sql')
          if [ "${#CHANGED[@]}" -eq 0 ]; then
            echo "No migration changes in this PR."
            exit 0
          fi
          printf 'Linting %s\n' "${CHANGED[@]}"
          npx --yes squawk-cli@2.68.0 "${CHANGED[@]}"
